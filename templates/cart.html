{% extends "base.html" %}

{% block title %}Shopping Cart | ISVANTE Pakistan{% endblock %}

{% block content %}
<div class="container" style="padding-top: 4rem; padding-bottom: 6rem;">
  <div style="margin-bottom: 2.5rem;">
    <span class="section-subtitle">Order Summary</span>
    <h1 class="section-title" style="font-size: 2.4rem;">Your Timepiece Cart</h1>
  </div>

  <div id="full-cart-container">
    <!-- Populated by JavaScript -->
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  let appliedCoupon = null;

  function renderFullCartPage() {
    const container = document.getElementById('full-cart-container');
    const cart = ISVANTE.getCart();

    if (cart.length === 0) {
      container.innerHTML = `
        <div style="text-align: center; padding: 6rem 1rem; background: var(--bg-surface); border: 1px solid var(--border-glass); border-radius: var(--radius-lg);">
          <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="rgba(212,175,55,0.4)" stroke-width="1.5" style="margin: 0 auto 1.5rem;">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <h2 style="font-size: 1.6rem; margin-bottom: 0.5rem;">Your Cart is Currently Empty</h2>
          <p style="color: var(--text-muted); margin-bottom: 2rem;">Explore our curated selection of luxury watches with Cash on Delivery across Pakistan.</p>
          <a href="/shop" class="btn btn-primary">Discover Watches</a>
        </div>
      `;
      return;
    }

    const { subtotal, shippingFee, threshold } = ISVANTE.calculateCartTotals();
    let discountAmount = 0;
    if (appliedCoupon && appliedCoupon.valid) {
      discountAmount = appliedCoupon.discount_amount;
    }
    const finalTotal = Math.max(0, (subtotal - discountAmount) + shippingFee);

    container.innerHTML = `
      <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 3rem; align-items: start;">
        
        <!-- Cart Items Table/List -->
        <div style="background: var(--bg-surface); border: 1px solid var(--border-glass); border-radius: var(--radius-md); overflow: hidden;">
          <div style="padding: 1.25rem 1.5rem; background: #111116; border-bottom: 1px solid var(--border-glass); display: grid; grid-template-columns: 3fr 1fr 1fr 0.5fr; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold-light);">
            <span>Item</span>
            <span style="text-align: center;">Quantity</span>
            <span style="text-align: right;">Total</span>
            <span></span>
          </div>

          <div style="padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem;">
            ${cart.map(item => `
              <div style="display: grid; grid-template-columns: 3fr 1fr 1fr 0.5fr; gap: 1rem; align-items: center; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-glass);">
                <div style="display: flex; gap: 1.25rem; align-items: center;">
                  <img src="${item.image}" alt="${item.name}" style="width: 80px; height: 80px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border-glass);">
                  <div>
                    <a href="/product/${item.slug}" style="font-family: var(--font-serif); font-size: 1.05rem; font-weight: 600; display: block; margin-bottom: 0.3rem;">${item.name}</a>
                    <span style="font-size: 0.85rem; color: var(--text-muted);">${ISVANTE.formatPKR(item.price)} each</span>
                  </div>
                </div>

                <div style="display: flex; justify-content: center;">
                  <div class="qty-controls" style="background: var(--bg-card);">
                    <button class="qty-btn" onclick="modifyQty(${item.id}, -1)">−</button>
                    <span class="qty-display">${item.quantity}</span>
                    <button class="qty-btn" onclick="modifyQty(${item.id}, 1)">+</button>
                  </div>
                </div>

                <div style="text-align: right; font-weight: 700; color: var(--gold-light); font-size: 1.05rem;">
                  ${ISVANTE.formatPKR(item.price * item.quantity)}
                </div>

                <div style="text-align: right;">
                  <button class="remove-item-btn" onclick="removeItem(${item.id})" title="Remove item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                  </button>
                </div>
              </div>
            `).join('')}
          </div>

          <div style="padding: 1.25rem 1.5rem; background: #0e0e12; display: flex; justify-content: space-between; align-items: center;">
            <a href="/shop" class="btn btn-outline btn-sm">
              &larr; Continue Shopping
            </a>
            <button class="btn btn-outline btn-sm" onclick="ISVANTE.clearCart(); renderFullCartPage();">
              Clear Cart
            </button>
          </div>
        </div>

        <!-- Checkout Summary Card -->
        <div style="background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 2rem;">
          <h3 style="font-size: 1.3rem; margin-bottom: 1.5rem;">Order Total</h3>
          
          <div style="display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 1.5rem; font-size: 0.95rem;">
            <div style="display: flex; justify-content: space-between;">
              <span style="color: var(--text-secondary);">Subtotal</span>
              <span style="font-weight: 600;">${ISVANTE.formatPKR(subtotal)}</span>
            </div>

            <div style="display: flex; justify-content: space-between;">
              <span style="color: var(--text-secondary);">Nationwide Delivery</span>
              <span>${shippingFee === 0 ? '<strong style="color: var(--color-success);">FREE</strong>' : ISVANTE.formatPKR(shippingFee)}</span>
            </div>

            ${appliedCoupon ? `
              <div style="display: flex; justify-content: space-between; color: var(--color-success);">
                <span>Coupon (${appliedCoupon.code})</span>
                <span>-${ISVANTE.formatPKR(discountAmount)}</span>
              </div>
            ` : ''}

            <div style="border-top: 1px solid var(--border-glass); padding-top: 1rem; display: flex; justify-content: space-between; font-size: 1.35rem; font-weight: 700;">
              <span>Total (PKR)</span>
              <span style="color: var(--gold-light);">${ISVANTE.formatPKR(finalTotal)}</span>
            </div>
          </div>

          <!-- Coupon Input -->
          <div style="margin-bottom: 1.5rem;">
            <label style="font-size: 0.8rem; color: var(--text-secondary); display: block; margin-bottom: 0.4rem;">Discount Coupon Code</label>
            <div style="display: flex; gap: 0.5rem;">
              <input type="text" id="coupon-input-field" class="form-input" placeholder="e.g. ISVANTE10" value="${appliedCoupon ? appliedCoupon.code : ''}" style="text-transform: uppercase;">
              <button class="btn btn-outline btn-sm" onclick="applyCouponCode()">Apply</button>
            </div>
          </div>

          <a href="/checkout" class="btn btn-primary btn-block" style="padding: 1rem 1.8rem; font-size: 0.95rem;">
            Proceed to Checkout
          </a>

          <div style="margin-top: 1.5rem; text-align: center; font-size: 0.8rem; color: var(--text-muted); line-height: 1.5;">
            Cash on Delivery Available Across Pakistan • Inspected & Verified
          </div>
        </div>

      </div>
    `;
  }

  function modifyQty(id, delta) {
    ISVANTE.updateQuantity(id, delta);
    renderFullCartPage();
  }

  function removeItem(id) {
    ISVANTE.removeFromCart(id);
    renderFullCartPage();
  }

  async function applyCouponCode() {
    const input = document.getElementById('coupon-input-field');
    const code = input ? input.value.trim() : '';
    if (!code) {
      ISVANTE.showToast('Please enter a coupon code.', 'error');
      return;
    }

    const { subtotal } = ISVANTE.calculateCartTotals();
    try {
      const res = await fetch('/api/coupons/validate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code, subtotal: subtotal })
      });
      const data = await res.json();
      if (data.valid) {
        appliedCoupon = data;
        ISVANTE.showToast(data.message);
        renderFullCartPage();
      } else {
        ISVANTE.showToast(data.message, 'error');
      }
    } catch (e) {
      ISVANTE.showToast('Error validating coupon.', 'error');
    }
  }

  document.addEventListener('DOMContentLoaded', renderFullCartPage);
</script>
{% endblock %}
